services:
  postgres:
    image: postgres:16-alpine
    container_name: dashmeboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashme
      POSTGRES_PASSWORD: dashme
      POSTGRES_DB: dashmeboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashme -d dashmeboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashmeboard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      DATABASE_URL: postgresql://dashme:dashme@postgres:5432/dashmeboard?schema=public
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: dashmeboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
