name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://dashme:dashme_ci_password@localhost:5432/dashmeboard_test?schema=public
  CORS_ORIGIN: http://localhost:5173
  BACKEND_PORT: "4000"

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashme
          POSTGRES_PASSWORD: dashme_ci_password
          POSTGRES_DB: dashmeboard_test
        options: >-
          --health-cmd "pg_isready -U dashme -d dashmeboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: SonarQube Cloud scan
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          projectBaseDir: .
